<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>go-infer · 看板</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#2f81f7; --green:#3fb950;
    --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;
  }
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  header .brand{font-weight:700;font-size:16px;letter-spacing:.5px}
  header .brand span{color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
  .dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.bad{background:var(--red)}
  .engines{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    padding:4px 10px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel2);cursor:pointer;font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .chip.active{border-color:var(--accent);color:var(--text);background:#1f2a44}
  .chip .task{color:var(--accent);font-family:var(--mono);font-size:11px}
  .ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--muted)}
  .inferbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .inferbar .ctrl{margin-left:auto}
  .ctrl input[type=range]{width:120px}
  .ctrl .val{font-family:var(--mono);color:var(--text);min-width:34px;text-align:right}
  nav.tabs{display:flex;gap:4px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--border)}
  nav.tabs button{
    background:none;border:none;color:var(--muted);padding:10px 16px;cursor:pointer;
    border-bottom:2px solid transparent;font-size:14px;
  }
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1400px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px}
  .panel h2{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}

  /* drop zone */
  #drop{
    display:block;
    border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s;
  }
  #drop.hover{border-color:var(--accent);background:#16233f;color:var(--text)}
  #drop p{margin:6px 0}
  #drop .big{font-size:16px;color:var(--text)}
  input[type=file]{display:none}
  button.btn{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;
  }
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.btn.danger{color:var(--red);border-color:#5c2b2b}
  button.btn.danger:hover{background:#2a1414}

  .infer{display:grid;grid-template-columns:1fr 320px;gap:18px}
  @media(max-width:900px){.infer{grid-template-columns:1fr}}
  #canvasWrap{background:#000;border-radius:8px;overflow:hidden;display:flex;justify-content:center}
  canvas{max-width:100%;height:auto;display:block}
  .meta{color:var(--muted);font-size:12px;margin-top:8px;font-family:var(--mono)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num{font-family:var(--mono);color:var(--muted)}
  tr.row{cursor:pointer}
  tr.row:hover,tr.row.sel{background:var(--panel2)}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .empty{color:var(--muted);text-align:center;padding:30px}

  /* pool */
  .group{margin-bottom:18px}
  .group>h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .group>h3 .cnt{color:var(--muted);font-weight:400;font-size:12px}
  .date{margin:10px 0 14px;padding-left:14px;border-left:2px solid var(--border)}
  .date>h4{margin:6px 0;font-size:12px;color:var(--yellow);font-weight:500;font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .thumb{
    position:relative;background:#000;border:1px solid var(--border);border-radius:6px;
    overflow:hidden;cursor:pointer;aspect-ratio:1;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .tag{
    position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);color:var(--green);
    font-size:10px;padding:1px 5px;border-radius:4px;font-family:var(--mono);
  }
  .thumb .tag.nolabel{color:var(--red)}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted)}
  .toolbar label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .spinner{display:none;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .spinner.on{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* modal */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;padding:30px;overflow:auto}
  #modal.on{display:flex;gap:18px;justify-content:center;align-items:flex-start}
  #modal .box{background:var(--panel);border:1px solid var(--border);border-radius:10px;max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 340px}
  @media(max-width:900px){#modal .box{grid-template-columns:1fr}}
  #modal .imgcol{background:#000;display:flex;align-items:center;justify-content:center;min-height:200px}
  #modal .imgcol img{max-width:100%;height:auto}
  #modal .side{padding:16px;display:flex;flex-direction:column;gap:12px}
  #modal .side pre{
    background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;
    overflow:auto;max-height:50vh;margin:0;font-family:var(--mono);font-size:12px;color:var(--text);
  }
  #modal .side .kv{color:var(--muted);font-size:12px;word-break:break-all}
  #modal .side .kv b{color:var(--text);font-weight:500}
  .close{position:fixed;top:18px;right:24px;font-size:28px;color:var(--muted);cursor:pointer;background:none;border:none}
  .close:hover{color:var(--text)}

  /* validate */
  .vform{display:grid;gap:14px}
  .field label.cap{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
  .pickrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.pickrow{grid-template-columns:1fr}}
  .pick{
    display:block;border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s;background:var(--bg);
  }
  .pick:hover{border-color:var(--accent)}
  .pick.has{border-style:solid;border-color:var(--green);color:var(--text)}
  .pick .t{font-size:13px}
  .pick .n{font-size:11px;font-family:var(--mono);margin-top:4px;word-break:break-all}
  .segrow{display:flex;gap:18px;flex-wrap:wrap}
  .segrow label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text)}
  .segrow .hint{color:var(--muted);font-size:12px}
  select,input[type=text],input[type=number]{
    background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit;width:100%;
  }
  select:focus,input[type=text]:focus,input[type=number]:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,129,247,.25);
  }
  select option{background:var(--panel);color:var(--text)}
  /* 复选/单选：用 accent-color 统一成主题蓝，去原生白底 */
  input[type=checkbox],input[type=radio]{
    appearance:none;-webkit-appearance:none;width:15px;height:15px;margin:0;
    background:var(--bg);border:1px solid var(--border);border-radius:3px;
    display:inline-grid;place-content:center;cursor:pointer;flex:none;
  }
  input[type=radio]{border-radius:50%}
  input[type=checkbox]:hover,input[type=radio]:hover{border-color:var(--accent)}
  input[type=checkbox]:checked,input[type=radio]:checked{
    background:var(--accent);border-color:var(--accent);
  }
  input[type=radio]:checked::after{
    content:"";width:7px;height:7px;border-radius:50%;background:#fff;
  }
  input[type=checkbox]:checked::after{
    content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{
    box-shadow:0 0 0 2px rgba(47,129,247,.3);
  }
  /* 滑块：细灰轨道 + 主题蓝拇指，跨浏览器 */
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:120px;height:4px;
    background:var(--border);border-radius:4px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);cursor:pointer;
    box-shadow:0 0 0 1px var(--accent);
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--accent);
    border:2px solid var(--panel);cursor:pointer;
  }
  .adv{border:1px solid var(--border);border-radius:8px}
  .adv>summary{cursor:pointer;padding:9px 12px;color:var(--muted);font-size:13px;list-style:none}
  .adv>summary::-webkit-details-marker{display:none}
  .adv>summary::before{content:'▸ ';color:var(--accent)}
  .adv[open]>summary::before{content:'▾ '}
  .adv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 12px 12px}
  .adv .grid .field input{width:100%}
  .vsubmit{display:flex;align-items:center;gap:12px}
  .errbar{display:none;background:#2a1414;border:1px solid #5c2b2b;color:#ffb3ad;padding:9px 12px;border-radius:7px;font-size:13px}
  .errbar.on{display:block}
  #vovery{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #vovery.on{display:flex}
  #vovery .bigspin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  #vovery .vt{color:var(--text);font-size:15px}
  #vovery .vs{color:var(--muted);font-size:12px}
  .vresults{display:grid;gap:14px;margin-top:6px}
  .job{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:14px}
  .job h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:9px}
  .job h3 .task{color:var(--accent);font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .metric{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 13px}
  .metric .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .metric .big{font-size:26px;font-weight:700;color:var(--green);font-family:var(--mono);line-height:1.2}
  .metric .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .job .stat{color:var(--muted);font-size:12px;margin-bottom:8px;font-family:var(--mono)}
  .apcell.num{font-family:var(--mono)}
  .bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-left:8px}

  /* video */
  .vlayout{display:grid;grid-template-columns:300px 1fr;gap:14px}
  @media(max-width:900px){.vlayout{grid-template-columns:1fr}}
  .vsources{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto}
  .vcat{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:8px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--border)}
  .vcat:first-child{margin-top:0}
  .vsrc{
    border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:pointer;background:var(--bg);
    display:flex;flex-direction:column;gap:3px;transition:.15s;
  }
  .vsrc:hover{border-color:var(--accent)}
  .vsrc.active{border-color:var(--accent);background:rgba(47,129,247,.1)}
  .vsrc .n{font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px}
  .vsrc .k{font-family:var(--mono);font-size:9px;text-transform:uppercase;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:0 6px}
  .vsrc .note{font-size:11px;color:var(--muted)}
  .vsrc .be{font-size:10px;color:var(--warn, #d29922)}
  .vadd{margin-top:4px;display:flex;flex-direction:column;gap:7px}
  .vadd input{width:100%}
  .vplayer{background:#000;border:1px solid var(--border);border-radius:8px;min-height:360px;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .vplayer img{max-width:100%;max-height:70vh;display:block}
  .vplayer .empty{color:#888;font-size:13px}
  .vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
  .vbar .stat{font-family:var(--mono)}
  .vbar .stat.live{color:var(--green)}
  .vbar .stat.err{color:#ffb3ad}
  .vctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .vctrl label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px}
  .vctrl input[type=number]{width:70px}
  .v-disabled{color:#ffb3ad;background:#2a1414;border:1px solid #5c2b2b;border-radius:7px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="brand">go-<span>infer</span></div>
  <div id="status"><span class="dot" id="dot"></span><span id="statustxt">连接中…</span></div>
</header>

<nav class="tabs">
  <button data-tab="infer" class="active">推理</button>
  <button data-tab="pool">采集池</button>
  <button data-tab="validate">验证</button>
  <button data-tab="video">视频源</button>
</nav>

<main>
  <!-- 推理 -->
  <section id="tab-infer">
    <div class="panel">
      <div class="inferbar">
        <div class="engines" id="engines"></div>
        <div class="ctrl">
          <label>conf <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.25"><span class="val" id="confval">0.25</span></label>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>上传图片</h2>
      <label id="drop" for="file">
        <p class="big">点击选择 / 拖入图片</p>
        <p>JPEG / PNG · 推理后在此处画框，结果在右侧</p>
        <input type="file" id="file" accept="image/*">
      </label>
    </div>
    <div class="infer">
      <div class="panel" style="margin:0">
        <h2>可视化</h2>
        <div id="canvasWrap"><div class="empty" id="ph">尚未推理</div></div>
        <div class="meta" id="infermeta"></div>
      </div>
      <div class="panel" style="margin:0">
        <h2>结果</h2>
        <div id="resultbox"><div class="empty">无结果</div></div>
      </div>
    </div>
  </section>

  <!-- 采集池 -->
  <section id="tab-pool" style="display:none">
    <div class="panel">
      <div class="toolbar">
        <button class="btn" id="refresh">刷新</button>
        <span class="spinner" id="spin"></span>
        <label><input type="checkbox" id="autoref"> 自动刷新（5s）</label>
        <span id="poolsummary"></span>
      </div>
      <div id="pool"><div class="empty">加载中…</div></div>
    </div>
  </section>

  <!-- 验证 -->
  <section id="tab-validate" style="display:none">
    <div class="panel">
      <h2>上传新模型并在测试集上跑 mAP</h2>
      <div class="vform">
        <div class="pickrow">
          <label class="pick" id="pickDet">
            <div class="t">检测 .onnx（可选）</div>
            <div class="n" id="detName">点击选择 yolov8n.onnx</div>
            <input type="file" id="detModel" accept=".onnx">
          </label>
          <label class="pick" id="pickSeg">
            <div class="t">分割 .onnx（可选）</div>
            <div class="n" id="segName">点击选择 yolov8n-seg.onnx</div>
            <input type="file" id="segModel" accept=".onnx">
          </label>
        </div>

        <div class="field">
          <label class="cap">测试集</label>
          <div class="segrow">
            <label><input type="radio" name="dsrc" value="default" checked> 默认测试集</label>
            <label><input type="radio" name="dsrc" value="upload"> 上传数据集 ZIP</label>
          </div>
        </div>

        <div class="field" id="defaultDsRow">
          <select id="testset"><option value="">加载中…</option></select>
          <div class="hint" style="color:var(--muted);font-size:12px;margin-top:5px" id="dsHint"></div>
        </div>
        <div class="field" id="uploadDsRow" style="display:none">
          <label class="pick" id="pickZip">
            <div class="t">数据集 ZIP</div>
            <div class="n" id="zipName">内含 images/&lt;split&gt; 与 labels/&lt;split&gt;（可带顶层包裹目录）</div>
            <input type="file" id="datasetZip" accept=".zip">
          </label>
        </div>

        <details class="adv">
          <summary>高级参数</summary>
          <div class="grid">
            <div class="field"><label class="cap">imgsz</label><input type="number" id="vImgsz" value="640" min="32" step="32"></div>
            <div class="field"><label class="cap">conf</label><input type="number" id="vConf" value="0.001" min="0" max="1" step="0.001"></div>
            <div class="field"><label class="cap">iou</label><input type="number" id="vIou" value="0.7" min="0" max="1" step="0.05"></div>
            <div class="field"><label class="cap">mask_thr</label><input type="number" id="vMaskThr" value="0.5" min="0" max="1" step="0.05"></div>
            <div class="field"><label class="cap">limit（0=全量）</label><input type="number" id="vLimit" value="0" min="0" step="10"></div>
            <div class="field" style="grid-column:1/-1"><label class="cap">classes（逗号分隔，留空用服务端默认）</label><input type="text" id="vClasses" placeholder="person,car,..."></div>
          </div>
        </details>

        <div class="errbar" id="vErr"></div>

        <div class="vsubmit">
          <button class="btn primary" id="vRun">开始校验</button>
          <span class="spinner" id="vSpin"></span>
          <span style="color:var(--muted);font-size:12px">结果不保存，看完即走；校验期间服务端单飞，第二个请求会被拒绝。</span>
        </div>
      </div>
    </div>

    <div id="vResults"></div>
  </section>

  <!-- 视频源 -->
  <section id="tab-video" style="display:none">
    <div class="panel">
      <div id="vDisabled" class="v-disabled" style="display:none"></div>
      <div class="vctrl">
        <label>抽帧 fps <input type="number" id="vFps" value="5" min="1" max="30" step="1"></label>
        <label>最大宽 <input type="number" id="vMaxw" value="960" min="320" max="1920" step="80"></label>
        <button class="btn primary" id="vStart">开始</button>
        <button class="btn" id="vStop">停止</button>
        <span style="color:var(--muted);font-size:12px">纯播放，仅临时预览，不导出、不存盘</span>
      </div>

      <div class="vlayout">
        <div>
          <div class="vsources" id="vSources"><div class="empty">加载中…</div></div>
          <div class="vadd">
            <input type="text" id="vUrl" placeholder="自定义 RTSP/HLS/HTTP 地址…">
            <button class="btn" id="vUseUrl">播放此地址</button>
            <label class="pick" id="pickVideo" style="margin:0">
              <div class="t">上传本地视频文件</div>
              <div class="n" id="vFileName">mp4/mov/mkv/avi/webm · 临时预览，看完即弃</div>
              <input type="file" id="vFile" accept="video/*">
            </label>
          </div>
        </div>
        <div>
          <div class="vplayer" id="vPlayer"><div class="empty" id="vPh">选择一个视频源并点「开始」（双击源也可直接播放）</div></div>
          <div class="vbar">
            <span class="stat" id="vStatus">未开始</span>
            <span id="vSourceName" style="color:var(--muted)"></span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 校验进行中遮罩 -->
<div id="vovery">
  <div class="bigspin"></div>
  <div class="vt">正在校验，可能需要数分钟…</div>
  <div class="vs">请勿关闭页面；完成后一次性返回 mAP 报告。</div>
</div>

<!-- 大图查看 -->
<div id="modal">
  <button class="close" id="modalclose">&times;</button>
  <div class="box">
    <div class="imgcol" id="modalimg"></div>
    <div class="side">
      <div>
        <div class="kv" id="modalkey"></div>
        <div class="kv" id="metainfo"></div>
      </div>
      <div>
        <h2 style="margin:0 0 6px">标签</h2>
        <pre id="modallabel">加载中…</pre>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn danger" id="delbtn">删除 image+label</button>
      </div>
    </div>
  </div>
</div>

<script>
const PAL = ['#3fb950','#f85149','#58a6ff','#d29922','#bc8cff','#ff7b72','#39c5cf','#f0883e'];
let engines = [], currentEngine = '';
let lastResult = null, lastImage = null, hoverIdx = -1;
const $ = s => document.querySelector(s);
const esc = s => (s+'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 引擎 / 状态 ----------
async function loadEngines(){
  try{
    const [h, e] = await Promise.all([fetch('/health').then(r=>r.json()), fetch('/engines').then(r=>r.json())]);
    engines = e.engines || [];
    $('#dot').className = 'dot ok';
    $('#statustxt').textContent = `${h.engines} 个引擎 · 在线`;
    renderEngines();
  }catch(err){
    $('#dot').className = 'dot bad';
    $('#statustxt').textContent = '服务不可达';
  }
}
function renderEngines(){
  const el = $('#engines');
  if(!el) return;
  if(!engines.length){ el.innerHTML = '<span style="color:var(--muted);font-size:12px">无引擎</span>'; return; }
  if(!engines.find(e=>e.name===currentEngine)) currentEngine = engines[0].name;
  el.innerHTML = engines.map(e=>`
    <div class="chip ${e.name===currentEngine?'active':''}" data-name="${esc(e.name)}">
      <span class="task">${esc(e.task)}</span>${esc(e.name)}
    </div>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ currentEngine=c.dataset.name; renderEngines(); });
}

// ---------- conf ----------
$('#conf').oninput = e => $('#confval').textContent = Number(e.target.value).toFixed(2);

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const t=b.dataset.tab;
    $('#tab-infer').style.display = t==='infer'?'block':'none';
    $('#tab-pool').style.display = t==='pool'?'block':'none';
    $('#tab-validate').style.display = t==='validate'?'block':'none';
    $('#tab-video').style.display = t==='video'?'block':'none';
    if(t==='pool') loadPool();
    if(t==='validate') loadValTestsets();
    if(t==='video') loadVideoSources();
  };
});

// ---------- 推理 ----------
const drop = $('#drop'), fileInput = $('#file');
// 整页阻止默认拖放，避免拖到非上传区时浏览器直接打开文件。
['dragenter','dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
// 计数器避免在 drop 内部子元素间移动时 hover 闪烁。
let dragDepth = 0;
drop.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;drop.classList.add('hover');});
drop.addEventListener('dragover',e=>e.preventDefault());
drop.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(dragDepth===0)drop.classList.remove('hover');});
drop.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;drop.classList.remove('hover');if(e.dataTransfer.files[0])runInfer(e.dataTransfer.files[0]);});
fileInput.onchange = ()=>{ if(fileInput.files[0]) runInfer(fileInput.files[0]); };

async function runInfer(file){
  if(!currentEngine){ alert('没有可用引擎'); return; }
  const fd = new FormData();
  fd.append('file', file);
  const url = `/predict?engine=${encodeURIComponent(currentEngine)}&conf=${$('#conf').value}`;
  $('#ph') && ($('#ph').textContent = '推理中…');
  const t0 = performance.now();
  let res;
  try{
    const r = await fetch(url,{method:'POST',body:fd});
    if(!r.ok){ throw new Error(await r.text()); }
    res = await r.json();
  }catch(err){
    $('#canvasWrap').innerHTML = `<div class="empty">推理失败: ${esc(err.message)}</div>`;
    return;
  }
  const img = new Image();
  img.onload = ()=>{ lastImage=img; lastResult=res; drawOverlay(); renderResult(res, performance.now()-t0); };
  img.src = URL.createObjectURL(file);
}

function drawOverlay(){
  const img = lastImage, res = lastResult;
  const wrap = $('#canvasWrap');
  wrap.innerHTML = '';
  const cv = document.createElement('canvas');
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img,0,0);
  const items = res.detections ? res.detections.map(d=>({...d,mask:null})) :
                res.instances ? res.instances : [];
  items.forEach((it,i)=>{
    const c = PAL[it.class_id % PAL.length];
    const lw = Math.max(1, Math.round(img.naturalWidth/400));
    if(it.mask && it.mask.length){
      ctx.fillStyle = c+'33'; ctx.strokeStyle=c; ctx.lineWidth=lw;
      it.mask.forEach(ring=>{
        ctx.beginPath(); ring.forEach((p,k)=> k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fill(); ctx.stroke();
      });
    }
    // box
    const [x1,y1,x2,y2]=[it.x1,it.y1,it.x2,it.y2];
    ctx.strokeStyle = i===hoverIdx?'#ffffff':c; ctx.lineWidth=(i===hoverIdx?lw+2:lw);
    ctx.strokeRect(x1,y1,x2-x1,y2-y1);
    // label
    const label = `${it.class_name} ${it.confidence.toFixed(2)}`;
    ctx.font = `${Math.max(12,Math.round(img.naturalWidth/55))}px ui-monospace,monospace`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = c; ctx.fillRect(x1, Math.max(0,y1-20), tw+8, 20);
    ctx.fillStyle = '#000'; ctx.fillText(label, x1+4, Math.max(14,y1-5));
  });
  wrap.appendChild(cv);
  $('#infermeta').textContent =
    `${res.engine} · ${res.task} · ${items.length} 个结果 · 服务端 ${res.took_ms}ms · ${img.naturalWidth}×${img.naturalHeight}`;
}

function renderResult(res, totalMs){
  const items = res.detections || res.instances || [];
  if(!items.length){ $('#resultbox').innerHTML='<div class="empty">无检测（hard negative）</div>'; return; }
  const isSeg = !!res.instances;
  $('#resultbox').innerHTML = `
    <table><thead><tr>
      <th>类别</th><th>置信</th>${isSeg?'<th>形状</th>':'<th>坐标</th>'}
    </tr></thead><tbody>
    ${items.map((it,i)=>`
      <tr class="row" data-i="${i}">
        <td><span class="swatch" style="background:${PAL[it.class_id%PAL.length]}"></span>${esc(it.class_name)}<span style="color:var(--muted)"> #${it.class_id}</span></td>
        <td class="num">${it.confidence.toFixed(3)}</td>
        <td class="num">${isSeg? (it.mask?it.mask.reduce((a,r)=>a+r.length,0)+' 点':'框') :
          `${Math.round(it.x1)},${Math.round(it.y1)} ${Math.round(it.x2)},${Math.round(it.y2)}`}</td>
      </tr>`).join('')}
    </tbody></table>
    <div class="meta">往返 ${Math.round(totalMs)}ms</div>`;
  $('#resultbox').querySelectorAll('tr.row').forEach(tr=>{
    tr.onmouseenter=()=>{hoverIdx=+tr.dataset.i; drawOverlay();};
    tr.onmouseleave=()=>{hoverIdx=-1; drawOverlay();};
    tr.onclick=()=>{ hoverIdx=(hoverIdx===+tr.dataset.i?-1:+tr.dataset.i); drawOverlay();
      $('#resultbox').querySelectorAll('tr.row').forEach(x=>x.classList.toggle('sel',+x.dataset.i===hoverIdx)); };
  });
}

// ---------- 采集池 ----------
let autoTimer=null;
$('#autoref').onchange=e=>{
  if(e.target.checked){ autoTimer=setInterval(loadPool,5000); loadPool(); }
  else clearInterval(autoTimer);
};
$('#refresh').onclick=loadPool;

async function loadPool(){
  $('#spin').classList.add('on');
  try{
    const r = await fetch('/api/captures');
    const data = await r.json();
    if(!data.enabled){ $('#pool').innerHTML='<div class="empty">采集未开启（启动时加 -capture-dir 启用）</div>'; $('#poolsummary').textContent=''; return; }
    renderPool(data.groups||[]);
  }catch(e){
    $('#pool').innerHTML=`<div class="empty">加载失败: ${esc(e.message)}</div>`;
  }finally{ $('#spin').classList.remove('on'); }
}
function renderPool(groups){
  let total=0;
  groups.forEach(g=>g.dates.forEach(d=>total+=d.files.length));
  $('#poolsummary').textContent = `${groups.length} 引擎 · ${total} 张`;
  if(!total){ $('#pool').innerHTML='<div class="empty">采集池为空</div>'; return; }
  $('#pool').innerHTML = groups.map(g=>{
    const gtotal = g.dates.reduce((a,d)=>a+d.files.length,0);
    return `<div class="group">
      <h3>▾ ${esc(g.engine)} <span class="cnt">${gtotal} 张</span></h3>
      <div>${g.dates.map(d=>`
        <div class="date">
          <h4>${esc(d.date)} · ${d.files.length}</h4>
          <div class="grid">${d.files.map(f=>thumb(f)).join('')}</div>
        </div>`).join('')}</div></div>`;
  }).join('');
  $('#pool').querySelectorAll('.thumb').forEach(t=>t.onclick=()=>openModal(t.dataset.key));
}
function thumb(f){
  const src = `/api/captures/file?key=${encodeURIComponent(f.key)}&t=${f.when}`;
  return `<div class="thumb" data-key="${esc(f.key)}">
    <img loading="lazy" src="${src}" alt="">
    <span class="tag ${f.has_label?'':'nolabel'}">${f.has_label?'LABEL':'NO-LBL'}</span>
  </div>`;
}

// ---------- modal ----------
let currentKey=null;
function openModal(key){
  currentKey=key;
  $('#modal').classList.add('on');
  $('#modalimg').innerHTML = `<img src="/api/captures/file?key=${encodeURIComponent(key)}&t=${Date.now()}">`;
  $('#modalkey').innerHTML = '<b>key</b> '+esc(key);
  $('#modallabel').textContent='加载中…'; $('#metainfo').textContent='';
  // find file meta
  fetch('/api/captures').then(r=>r.json()).then(data=>{
    const f=(data.groups||[]).flatMap(g=>g.dates).flatMap(d=>d.files).find(x=>x.key===key);
    if(f){
      $('#metainfo').innerHTML = `<b>大小</b> ${(f.size/1024).toFixed(1)} KB · <b>时间</b> ${new Date(f.when*1000).toLocaleString()}`;
      if(f.has_label && f.label_key){
        fetch('/api/captures/file?key='+encodeURIComponent(f.label_key)).then(r=>r.text()).then(t=>$('#modallabel').textContent=t||'(空标签 / hard negative)');
      }else{ $('#modallabel').textContent='(无标签，hard negative)'; }
    }
  });
}
$('#modalclose').onclick=closeModal;
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function closeModal(){ $('#modal').classList.remove('on'); currentKey=null; }
$('#delbtn').onclick=async()=>{
  if(!currentKey) return;
  if(!confirm('删除这张图片及其标签？')) return;
  const r=await fetch('/api/captures/file?key='+encodeURIComponent(currentKey),{method:'DELETE'});
  if(!r.ok){ alert('删除失败: '+await r.text()); return; }
  closeModal(); loadPool();
};

// ---------- 验证 ----------
let valTestsetsLoaded = false;
function bindPick(inputId, boxId, nameId, placeholder){
  const inp = $('#'+inputId), box = $('#'+boxId), nm = $('#'+nameId);
  inp.onchange = ()=>{
    if(inp.files[0]){ box.classList.add('has'); nm.textContent = inp.files[0].name; }
    else { box.classList.remove('has'); nm.textContent = placeholder; }
  };
}
bindPick('detModel','pickDet','detName','点击选择 yolov8n.onnx');
bindPick('segModel','pickSeg','segName','点击选择 yolov8n-seg.onnx');
bindPick('datasetZip','pickZip','zipName','内含 images/<split> 与 labels/<split>（可带顶层包裹目录）');

document.querySelectorAll('input[name=dsrc]').forEach(r=>{
  r.onchange=()=>{
    const up = r.value==='upload' && r.checked;
    $('#uploadDsRow').style.display = up?'block':'none';
    $('#defaultDsRow').style.display = up?'none':'block';
  };
});

async function loadValTestsets(){
  if(valTestsetsLoaded) return;
  try{
    const r = await fetch('/api/validate/testsets');
    const data = await r.json();
    const sel = $('#testset');
    if(!data.enabled){
      sel.innerHTML = '<option value="">校验未开启</option>';
      $('#dsHint').textContent = '启动时加 -validate-testset name=path:split 配置默认测试集，或直接上传 ZIP。';
      valTestsetsLoaded = true; return;
    }
    const ts = data.testsets||[];
    if(!ts.length){
      sel.innerHTML = '<option value="">（未配置默认测试集，请上传 ZIP）</option>';
    }else{
      sel.innerHTML = ts.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} · split=${esc(t.split)}</option>`).join('');
    }
    valTestsetsLoaded = true;
  }catch(e){
    $('#testset').innerHTML = '<option value="">加载失败</option>';
    $('#dsHint').textContent = '加载测试集列表失败: '+e.message;
  }
}

function vErr(msg){
  const el = $('#vErr');
  if(msg){ el.textContent = msg; el.classList.add('on'); }
  else { el.classList.remove('on'); el.textContent=''; }
}

$('#vRun').onclick = async ()=>{
  vErr('');
  const det = $('#detModel').files[0], seg = $('#segModel').files[0];
  if(!det && !seg){ vErr('请至少上传一个 .onnx 模型（检测或分割）'); return; }
  const useUpload = document.querySelector('input[name=dsrc]:checked').value==='upload';
  const zip = $('#datasetZip').files[0];
  const tsName = $('#testset').value;
  if(useUpload){
    if(!zip){ vErr('请上传数据集 ZIP'); return; }
  }else if(!tsName){
    vErr('请选择一个默认测试集，或切换到「上传数据集 ZIP」'); return;
  }

  const fd = new FormData();
  if(det) fd.append('det_model', det);
  if(seg) fd.append('seg_model', seg);
  if(useUpload) fd.append('dataset', zip);
  else fd.append('testset', tsName);
  fd.append('imgsz', $('#vImgsz').value);
  fd.append('conf', $('#vConf').value);
  fd.append('iou', $('#vIou').value);
  fd.append('mask_thr', $('#vMaskThr').value);
  fd.append('limit', $('#vLimit').value);
  const classes = $('#vClasses').value.trim();
  if(classes) fd.append('classes', classes);

  $('#vResults').innerHTML = '';
  $('#vovery').classList.add('on');
  $('#vSpin').classList.add('on');
  try{
    const r = await fetch('/api/validate',{method:'POST',body:fd});
    if(!r.ok){
      const txt = await r.text();
      if(r.status===409) vErr('已有一个校验在进行中（服务端单飞），请等它完成后再试。');
      else if(r.status===413) vErr('上传体积超过服务端上限。');
      else vErr('校验失败: '+(txt || r.status));
      return;
    }
    const rep = await r.json();
    renderValReport(rep);
  }catch(e){
    vErr('请求失败: '+e.message);
  }finally{
    $('#vovery').classList.remove('on');
    $('#vSpin').classList.remove('on');
  }
};

function renderValReport(rep){
  const host = $('#vResults');
  const head = `<div class="meta" style="margin-bottom:6px">共 ${rep.images} 张 · ${rep.classes} 个类 · 总耗时 ${(rep.took_ms/1000).toFixed(1)}s</div>`;
  if(!rep.jobs || !rep.jobs.length){
    host.innerHTML = head + '<div class="empty">没有任务结果</div>';
    return;
  }
  host.innerHTML = head + '<div class="vresults">' + rep.jobs.map(job=>{
    const metrics = (job.metrics||[]).map(m=>{
      const pct = v=> (v*100).toFixed(1);
      return `<div class="metric">
        <div class="lab">${esc(m.label)} mAP@.5</div>
        <div class="big">${pct(m.map50)}</div>
        <div class="sub">mAP@.5:.95 ${pct(m.map5095)}</div>
      </div>`;
    }).join('');
    const rows = (job.metrics||[]).flatMap(m=>{
      const list = (m.per_class||[]).slice().sort((a,b)=>b.ap50-a.ap50);
      return list.map((c,i)=>{
        const v = c.ap50;
        const w = Math.round(v*120);
        return `<tr>
          ${i===0?`<td rowspan="${list.length}" style="vertical-align:top;color:var(--muted)">${esc(m.label)}</td>`:''}
          <td><span class="swatch" style="background:${PAL[c.class_id%PAL.length]}"></span>${esc(c.class_name)}<span style="color:var(--muted)"> #${c.class_id}</span></td>
          <td class="num apcell">${(v*100).toFixed(1)}<span class="bar" style="width:${w}px"></span></td>
        </tr>`;
      });
    }).join('');
    const table = rows ? `<table><thead><tr><th style="width:60px">指标</th><th>类别</th><th>AP@.5</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">无 GT 类别</div>';
    return `<div class="job">
      <h3>${esc(job.name)} <span class="task">${esc(job.task)}</span></h3>
      <div class="stat">预测 ${job.predictions} · 标注 ${job.ground_truths} · 耗时 ${(job.took_ms/1000).toFixed(1)}s</div>
      <div class="metrics">${metrics}</div>
      ${table}
    </div>`;
  }).join('') + '</div>';
}

// ---------- 视频源（纯播放，不做推理） ----------
const VCAT = {demo:'演示流', tv:'电视直播', nature:'自然风光', traffic:'监控/交通'};
const VCAT_ORDER = ['demo','tv','nature','traffic'];
let vSources = [], vSelectedSrc = '', vRunning = false, vFrame = null;

async function loadVideoSources(){
  try{
    const r = await fetch('/api/video/sources');
    const d = await r.json();
    if(!d.enabled){
      $('#vDisabled').style.display = 'block';
      $('#vDisabled').textContent = '视频源未开启：服务端未找到 ffmpeg（用 -video-ffmpeg 指定路径后重启）。';
      $('#vSources').innerHTML = '<div class="empty">不可用</div>';
      return;
    }
    $('#vDisabled').style.display = 'none';
    vSources = d.sources || [];
    renderVSources();
  }catch(err){
    $('#vSources').innerHTML = `<div class="empty">加载失败: ${esc(err.message)}</div>`;
  }
}
function renderVSources(){
  const el = $('#vSources');
  if(!vSources.length){ el.innerHTML = '<div class="empty">无内置源，用下方自定义地址</div>'; return; }
  // 按分类分组，未知分类归到最后。
  const groups = {};
  vSources.forEach(s=>{
    const c = VCAT[s.category] ? s.category : 'other';
    (groups[c] = groups[c] || []).push(s);
  });
  const order = VCAT_ORDER.filter(c=>groups[c]);
  if(groups.other) order.push('other');
  let html = '';
  order.forEach(c=>{
    const label = VCAT[c] || '其他';
    html += `<div class="vcat">${esc(label)}（${groups[c].length}）</div>`;
    html += groups[c].map(s=>`
      <div class="vsrc ${vSelectedSrc===s.id?'active':''}" data-id="${esc(s.id)}" title="双击播放">
        <div class="n"><span class="k">${esc(s.kind)}</span>${esc(s.name)}${s.best_effort?'<span class="be">可能失效</span>':''}</div>
        ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
      </div>`).join('');
  });
  el.innerHTML = html;
  el.querySelectorAll('.vsrc').forEach(c=>{
    c.onclick=()=>{
      vSelectedSrc = c.dataset.id;
      $('#vUrl').value = '';
      renderVSources();
      const s = vSources.find(x=>x.id===vSelectedSrc);
      $('#vSourceName').textContent = s ? s.name : '';
    };
    c.ondblclick=()=>{ c.onclick(); startVideo(); };
  });
}
function setVStatus(txt, cls){
  const st = $('#vStatus');
  st.textContent = txt;
  st.className = 'stat' + (cls?(' '+cls):'');
}
function startVideo(){
  if(vRunning) return;
  let src = '', name = '';
  const url = $('#vUrl').value.trim();
  if(url){ src = 'url:' + url; name = url; }
  else if(vSelectedSrc){ src = vSelectedSrc; name = $('#vSourceName').textContent; }
  else { setVStatus('请先选择视频源或填写地址','err'); return; }

  const params = new URLSearchParams({
    src, fps: $('#vFps').value, maxw: $('#vMaxw').value,
  });
  const img = new Image();
  setVStatus('连接中…','');
  $('#vSourceName').textContent = name;
  let gotFrame = false;
  img.onload = ()=>{ gotFrame = true; setVStatus('播放中','live'); };
  // MJPEG 用 <img> 播放，出错时浏览器不暴露 HTTP 状态码；服务端日志会记录真实原因。
  img.onerror = ()=>{
    stopVideo();
    setVStatus(gotFrame ? '流已结束/中断' : '无法连接（源失效、会话已满或 ffmpeg 报错，见服务端日志）', 'err');
  };
  $('#vPlayer').innerHTML = '';
  $('#vPlayer').appendChild(img);
  vFrame = img;
  vRunning = true;
  // 加时间戳避免浏览器缓存旧流。
  img.src = '/api/video/stream?' + params.toString() + '&_t=' + Date.now();
}
function stopVideo(){
  if(vFrame){ try{ vFrame.src = ''; }catch(e){} vFrame.remove(); vFrame = null; }
  vRunning = false;
  $('#vPlayer').innerHTML = '<div class="empty" id="vPh">已停止</div>';
  setVStatus('已停止','');
}
$('#vStart').onclick = startVideo;
$('#vStop').onclick = stopVideo;
$('#vUseUrl').onclick = ()=>{ if($('#vUrl').value.trim()){ vSelectedSrc=''; renderVSources(); startVideo(); } };
$('#pickVideo').addEventListener('click',()=>$('#vFile').value='');
$('#vFile').onchange = async ()=>{
  const f = $('#vFile').files[0];
  if(!f) return;
  $('#vFileName').textContent = f.name;
  $('#pickVideo').classList.add('has');
  const fd = new FormData(); fd.append('video', f);
  setVStatus('上传中…','');
  try{
    const r = await fetch('/api/video/upload',{method:'POST',body:fd});
    if(!r.ok) throw new Error(await r.text());
    const ref = await r.json();
    vSelectedSrc = 'upload:'+ref.id;
    $('#vSourceName').textContent = ref.name;
    renderVSources();
    startVideo();
  }catch(err){
    setVStatus('上传失败：'+err.message,'err');
  }
};

// ---------- init ----------
loadEngines();
setInterval(loadEngines, 10000);
</script>
</body>
</html>
